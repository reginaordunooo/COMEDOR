<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>El Comedor - Donar</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    </head>
    <body>
        <div class="container-fluid font-Jost px-0">
            <header>
                <div id="header" class="nav-pills">
                    <div class="row align-items-center py-2 m-0 p-0">
                        <div id="titulo" class="col-12 text-center col-md-12 text-center col-lg-3 text-end align-items-center pt-1">
                            <h3 class="fw-semibold">El Comedor</h3>
                        </div>
                        <div id="navbar" class="col-12 text-center col-md-10 text-center col-lg-7 text-center">
                            <ul id="nav_ul" class="nav nav-pills fw-semibold align-items-center justify-content-center">
                                <li><a class="nav-link" href="#">Dashboard</a></li>
                                <li><a class="nav-link" href="index.html">Productos</a></li>
                                <li><a class="nav-link" href="#">Entregas</a></li>
                                <li><a class="nav-link" href="donar.html">Donar</a></li>
                                <li><button class="btn-signout py-1 ms-2 fw-semibold border border-1 border-white rounded-2" href="#">Cerrar Sesion</button></li>
                            </ul>
                        </div>
                        <div id="usuario" class="col-12 text-center col-md-2 text-center col-lg-1 ps-5">
                            <a href="#"><img src= "usuario.png" alt="usuario" width="40"></a>
                        </div>
                    </div>
                </div>
            </header>

            <main id="main">
                <div class="row m-0 p-0">
                    <div id="titulo_pagina" class="col-4 col-md-4 col-lg-4 text-center m-0 p-0">
                        <h1 class="fw-bold p-4">Donación</h1>
                    </div>
                </div>
                <div class="row m-0 p-0">            
                    <div id="upload-container" class="col-12 col-md-6 text-center col-lg-6 text-end ps-5 py-5">
                        <img src="añadir_img.png" alt="añadir imagen" id="anadirIMG" width="300" class="text-center">
                            <div id="upload-text">
                                Cargar foto desde la biblioteca<input type="file" id="upload-photo" accept="image/*">
                                <label for="upload-photo" class="seleccionar pointer px-2 py-1 border-1 rounded-1">Seleccionar</label>
                            </div> 
                    </div>
                    <div id="info" class= "col-12 text-center col-md-5 text-md-start col-lg-4 text-lg-start">
                        <form action="" class="pb-4 pt-2">
                            <label for="id" class="d-block mb-4"><h4>ID</h4></label>
                            <input type="text" name="id" id="id" class="px-2 py-1">
                        </form>
                        <form action="" class="pb-4 pt-2">
                            <label for="tipo" class="d-block mb-4"><h4>Tipo</h4></label>
                            <select name="tipo" id="tipo" class="px-2 py-1">
                                <option value="">Selecciona una opción</option>
                                <option value="enl">Enlatado</option>
                                <option value="ace">Aceite</option>
                                <option value="leg">Legumbres</option>
                            </select>                
                        </form>
                        <form action="" class="pb-4 pt-2">
                            <label for="descr" class="d-block mb-4"><h4>Descripción</h4></label>
                            <input type="text" name="descr" id="descr" class="px-2 py-1">
                        </form>
                        <form action="" class="pb-4 pt-2">
                            <label for="cant" class="d-block mb-4"><h4>Cantidad</h4></label>
                            <input type="number" name="cant" id="cant" class="px-2 py-1">
                        </form>
                    </div>
                    <div id="botones" class="col-12 text-center text-md-end text-lg-end p-5">
                        <a class="boton-cancelar px-5 py-1 m-4 rounded-1 text-decoration-none" href="index.html">CANCELAR</a>
                        <button class="boton-donar px-5 py-1 rounded-1">DONAR</button>
                    </div>
                </div>
            </main>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <script src="scriptdonar.js"></script>
    </body>
</html>
