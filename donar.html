<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>El Comedor - Donar</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    </head>
    <body>
        <header>
            <nav id="header" class="nav-pills container-fluid">
                <div class="row align-items-center p-2">
                    <div id="titulo" class="col-3 ms-5 me-auto pt-2">
                        <h3 class="fw-semibold">El Comedor</h3>
                    </div>
                    <div id="navbar" class="col-6">
                        <ul id="nav_ul" class="nav nav-pills fw-semibold align-items-center">
                            <li><a class="nav-link" href="#">Dashboard</a></li>
                            <li><a class="nav-link" href="index.html">Productos</a></li>
                            <li><a class="nav-link" href="#">Entregas</a></li>
                            <li><a class="nav-link" href="donar.html">Donar</a></li>
                            <li><button class="btn-signout px-2 py-1 ms-2 fw-semibold border border-1 border-white rounded-2" href="#">Cerrar Sesion</button></li>
                        </ul>
                    </div>
                    <div id="usuario" class="col-1 ps-5">
                        <a href="#"><img src= "usuario.png" alt="usuario" width="80%"></a>
                    </div>
                </div>
            </nav>
        </header>


        <main id="main" class="container-fluid">
            <div id="titulo_pagina" class="col-lg-12 ms-5 me-auto p-4">
                <h1 class="fw-bold">Donación</h1>
            </div>
                <div id="contenedor" class="row align-items-center">
                    <div id="upload-container" class="col-lg-3 ms-5 text-right">
                        <img src="añadir_img.png" alt="añadir imagen" id="anadirIMG" width="100%">
                            <div id="upload-text">
                                Cargar foto desde la biblioteca<input type="file" id="upload-photo" accept="image/*">
                                <label for="upload-photo" class="seleccionar">Seleccionar</label>
                            </div> 
                    </div>
                    <div id="info" class= "col-lg-7 p-3">
                        <form action="" class="formulario">
                            <label for="id"><p>ID</p></label>
                            <input type="text" name="id" id="id" class="entrada">
                        </form>
                        <form action="" class="formulario">
                            <label for="tipo"><p>Tipo</p></label>
                            <select name="tipo" id="tipo" class="entrada">
                                <option value="">Selecciona una opción</option>
                                <option value="enl">Enlatado</option>
                                <option value="ace">Aceite</option>
                                <option value="leg">Legumbres</option>
                            </select>                
                        </form>
                        <form action="" class="formulario">
                            <label for="descr"><p>Descripción</p></label>
                            <input type="text" name="descr" id="descr" class="entrada">
                        </form>
                        <form action="" class="formulario">
                            <label for="cant"><p>Cantidad</p></label>
                            <input type="number" name="cant" id="cant" class="entrada">
                        </form>
                    </div>
                </div>
                <div id="botones" class="col-lg-12 p-4 align-items-right">
                    <a class="boton-cancelar px-4 py-1 ms-2 me-auto rounded-2 text-decoration-none" href="index.html">CANCELAR</a>
                    <button class="boton-donar px-4 py-1 ms-2 rounded-2">DONAR</button>
                </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    </body>
</html>
